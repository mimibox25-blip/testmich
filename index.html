<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz anatomiczny – dopasuj elementy</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --border: #cbd5e1;
      --text: #1e293b;
      --ok-bg: #dcfce7;
      --ok-border: #16a34a;
      --err-bg: #fee2e2;
      --err-border: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem 1rem;
      line-height: 1.4;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      background: var(--card);
      padding: 1.5rem;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.3rem;
      margin: 0;
    }

    .badge {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.9rem;
    }

    .image-wrapper {
      text-align: center;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .image-wrapper img {
      max-width: 100%;
      max-height: 440px;
      object-fit: contain;
      border-radius: 6px;
    }

    .hint {
      font-size: 0.9rem;
      color: #475569;
      margin-bottom: 0.75rem;
    }

    /* Bank terminów */
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.9rem;
      background: #f8fafc;
      border: 1px dashed var(--border);
      border-radius: 10px;
      min-height: 58px;
      margin-bottom: 1.5rem;
    }

    .chip {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .chip:hover {
      border-color: var(--primary);
    }

    .chip.selected {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .chip.used {
      opacity: 0.35;
      pointer-events: none;
    }

    /* Lista numerów 1-7 */
    .slots-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.65rem;
    }

    .slot-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .slot-num {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--text);
      color: #ffffff;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .drop-zone {
      flex: 1;
      min-height: 44px;
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .drop-zone.filled {
      border-style: solid;
      border-color: #94a3b8;
      font-weight: 600;
    }

    .drop-zone.correct {
      background: var(--ok-bg);
      border-color: var(--ok-border);
      color: #14532d;
    }

    .drop-zone.wrong {
      background: var(--err-bg);
      border-color: var(--err-border);
      color: #7f1d1d;
    }

    .clear-x {
      font-size: 0.85rem;
      color: #64748b;
      margin-left: 0.5rem;
      padding: 0.1rem 0.4rem;
    }

    .correct-hint {
      font-size: 0.85rem;
      color: #15803d;
      font-weight: 600;
      margin-left: 0.5rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.5rem;
      align-items: center;
    }

    button.btn {
      padding: 0.65rem 1.25rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-check { background: var(--primary); color: #fff; }
    .btn-reset { background: #e2e8f0; color: var(--text); }
    .btn-next  { background: #0f172a; color: #fff; margin-left: auto; }

    .result-msg {
      margin-top: 1rem;
      font-weight: 700;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 id="quiz-title">Obrazek nr 1</h1>
    <span class="badge" id="progress-badge">1 / 1</span>
  </div>

  <div class="image-wrapper">
    <img id="quiz-image" src="" alt="Schemat anatomiczny" />
  </div>

  <div class="hint">
    Kliknij pojęcie z puli, a następnie kliknij odpowiedni numer (lub przeciągnij). Kliknięcie wypełnionego pola usuwa odpowiedź.
  </div>

  <div class="word-bank" id="word-bank"></div>

  <div class="slots-list" id="slots-list"></div>

  <div class="actions">
    <button class="btn btn-check" id="check-btn">Sprawdź odpowiedzi</button>
    <button class="btn btn-reset" id="reset-btn">Wyczyść</button>
    <button class="btn btn-next" id="next-btn" style="display:none;">Następny obrazek →</button>
  </div>

  <div class="result-msg" id="result-msg"></div>
</div>

<script>
  // TUTAJ DODAJESZ KOLEJNE OBRAZKI I LISTY TERMINÓW
  const quizzes = [
    {
      title: "Obrazek nr 1 – Budowa kręgu",
      image: "kreg.png", // <-- wrzuć plik kreg.png do folderu images na GitHubie
      items: [
        "Powierzchnia międzykręgowa", // 1
        "Trzon kręgu",                // 2
        "Wyrostek kolczysty",         // 3
        "Wyrostek poprzeczny",        // 4
        "Wyrostek stawowy górny",     // 5
        "Wyrostek stawowy dolny",     // 6
        "Nasada łuku kręgu"           // 7
      ]
    }
    // Przykład jak dodać drugi obrazek (odkomentuj i uzupełnij):
    /*
    ,{
      title: "Obrazek nr 2 – Kolejna struktura",
      image: "images/obrazek2.png",
      items: [
        "Termin dla 1",
        "Termin dla 2"
      ]
    }
    */
  ];

  let currentQuizIndex = 0;
  let selectedTerm = null;
  let userAnswers = [];
  let checked = false;

  const titleEl = document.getElementById("quiz-title");
  const badgeEl = document.getElementById("progress-badge");
  const imgEl = document.getElementById("quiz-image");
  const bankEl = document.getElementById("word-bank");
  const slotsEl = document.getElementById("slots-list");
  const resultEl = document.getElementById("result-msg");
  const nextBtn = document.getElementById("next-btn");

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadQuiz(index) {
    const quiz = quizzes[index];
    checked = false;
    selectedTerm = null;
    userAnswers = new Array(quiz.items.length).fill(null);
    resultEl.textContent = "";

    titleEl.textContent = quiz.title;
    badgeEl.textContent = `${index + 1} / ${quizzes.length}`;
    imgEl.src = quiz.image;
    nextBtn.style.display = quizzes.length > 1 ? "inline-block" : "none";

    renderAll();
  }

  function renderAll() {
    const quiz = quizzes[currentQuizIndex];
    renderBank(quiz.items);
    renderSlots(quiz.items);
  }

  // Zapamiętujemy przetasowaną kolejność dla bieżącego podejścia
  let shuffledPool = [];

  function initAndLoad(index) {
    shuffledPool = shuffle(quizzes[index].items);
    loadQuiz(index);
  }

  function renderBank() {
    bankEl.innerHTML = "";
    shuffledPool.forEach((term) => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = term;
      chip.draggable = true;

      if (userAnswers.includes(term)) {
        chip.classList.add("used");
      }
      if (selectedTerm === term) {
        chip.classList.add("selected");
      }

      chip.addEventListener("click", () => {
        if (checked || userAnswers.includes(term)) return;
        selectedTerm = selectedTerm === term ? null : term;
        renderBank();
      });

      chip.addEventListener("dragstart", (e) => {
        if (checked) return;
        selectedTerm = term;
        e.dataTransfer.setData("text/plain", term);
      });

      bankEl.appendChild(chip);
    });
  }

  function renderSlots(correctItems) {
    slotsEl.innerHTML = "";

    correctItems.forEach((correctTerm, idx) => {
      const row = document.createElement("div");
      row.className = "slot-row";

      const num = document.createElement("div");
      num.className = "slot-num";
      num.textContent = idx + 1;

      const zone = document.createElement("div");
      zone.className = "drop-zone";

      const currentVal = userAnswers[idx];

      if (currentVal) {
        zone.classList.add("filled");
        zone.innerHTML = `<span>${currentVal}</span>` + (!checked ? `<span class="clear-x">✕</span>` : "");
      } else {
        zone.innerHTML = `<span style="color:#94a3b8; font-weight:400;">Wybierz termin dla nr ${idx + 1}...</span>`;
      }

      if (checked) {
        if (currentVal === correctTerm) {
          zone.classList.add("correct");
        } else {
          zone.classList.add("wrong");
          const hint = document.createElement("span");
          hint.className = "correct-hint";
          hint.textContent = `→ ${correctTerm}`;
          zone.appendChild(hint);
        }
      }

      // Obsługa kliknięcia w pole
      zone.addEventListener("click", () => {
        if (checked) return;
        if (selectedTerm) {
          userAnswers[idx] = selectedTerm;
          selectedTerm = null;
          renderAll();
        } else if (userAnswers[idx]) {
          userAnswers[idx] = null;
          renderAll();
        }
      });

      // Obsługa drag & drop
      zone.addEventListener("dragover", (e) => {
        e.preventDefault();
        if (!checked) zone.classList.add("drag-over");
      });

      zone.addEventListener("dragleave", () => {
        zone.classList.remove("drag-over");
      });

      zone.addEventListener("drop", (e) => {
        e.preventDefault();
        zone.classList.remove("drag-over");
        if (checked) return;
        const term = e.dataTransfer.getData("text/plain") || selectedTerm;
        if (term && !userAnswers.includes(term)) {
          userAnswers[idx] = term;
          selectedTerm = null;
          renderAll();
        }
      });

      row.appendChild(num);
      row.appendChild(zone);
      slotsEl.appendChild(row);
    });
  }

  document.getElementById("check-btn").addEventListener("click", () => {
    const correctItems = quizzes[currentQuizIndex].items;
    checked = true;
    selectedTerm = null;

    let score = 0;
    correctItems.forEach((term, idx) => {
      if (userAnswers[idx] === term) score++;
    });

    renderAll();
    resultEl.textContent = `Wynik: ${score} / ${correctItems.length} (${Math.round((score / correctItems.length) * 100)}%)`;
  });

  document.getElementById("reset-btn").addEventListener("click", () => {
    initAndLoad(currentQuizIndex);
  });

  nextBtn.addEventListener("click", () => {
    currentQuizIndex = (currentQuizIndex + 1) % quizzes.length;
    initAndLoad(currentQuizIndex);
  });

  initAndLoad(0);
</script>
</body>
</html>
